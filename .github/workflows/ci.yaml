on:
  pull_request:
  push:
    branches:
      - main
  # Package versions are not pinned inside the images (Alpine/Debian only
  # ever serve the latest build per release branch), so a periodic rebuild is
  # what picks up distro security fixes when nothing in this repo changed.
  schedule:
    - cron: '0 12 * * 1'  # Mondays 12:00 UTC
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-matrix:
    name: Generate job matrices
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.all.outputs.matrix || steps.images.outputs.matrix }}
    steps:
      - name: Generate matrix (changed images)
        id: images
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: hellofresh/action-changed-files@3b2e213935a6ca5fa6669c8cbffb68eb5a6dbd89 # v4.0.0
        with:
          pattern: images/(?P<image>[^/]+)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'push' && github.event_name != 'pull_request'
      - name: Generate matrix (all images)
        id: all
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        run: |
          include=""
          for dir in images/*/; do
            image="$(basename "${dir}")"
            include="${include:+${include},}{\"image\":\"${image}\",\"reason\":\"scheduled\"}"
          done
          echo "matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"

  lowercase-user:
    runs-on: ubuntu-24.04
    outputs:
      user: ${{ steps.lowercase-username.outputs.user }}
    steps:
      - name: Lowercase username
        id: lowercase-username
        run: echo "user=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

  version:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for .version.sh under images/${{ matrix.image }}
        run: |
          if [ -f images/${{ matrix.image }}/.version.sh ]; then
            echo "Found .version.sh"
            . ./images/${{ matrix.image }}/.version.sh
            echo -n "${VERSION}" > /tmp/version
          else
            echo "No .version.sh found"
            touch /tmp/version
          fi
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.image }}-version
          path: /tmp/version

  docker:
    needs: [ generate-matrix, lowercase-user, version ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/docker-ci.yaml@4a4ab216b29662f3424712de85cf3a0a1a0ac7af # v2.0.19
    with:
      push: ${{ github.event_name != 'pull_request' }}
      context: images/${{ matrix.image }}
      security-category: ${{ matrix.image }}
      dockerfile: images/${{ matrix.image }}/Dockerfile
      image-name: ${{ needs.lowercase-user.outputs.user }}/${{ matrix.image }}
      version-from-artifact: ${{ matrix.image }}-version
      platforms: ${{ ( matrix.image != 'archlinux-pkgbuild' && matrix.image != 'symmetricds' && matrix.image != 'mesh-node' && matrix.image != 'mesh-node-nightly' ) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    secrets:
      secrets: |
        DARWIN_SDK_URL="${{ ( matrix.image == 'rust-cross' ) && secrets.DARWIN_SDK_URL || '' }}"
        IOS_SDK_URL="${{ ( matrix.image == 'rust-cross' ) && secrets.IOS_SDK_URL || '' }}"
        IOS_SIMULATOR_SDK_URL="${{ ( matrix.image == 'rust-cross' ) && secrets.IOS_SIMULATOR_SDK_URL || '' }}"

  docker-results:
    if: always()
    needs: [ docker ]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          result="${{ needs.docker.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images built successfully"
          else
            echo "One or more images failed to build"
            exit 1
          fi
