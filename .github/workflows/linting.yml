name: Linting
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-matrix:
    name: Generate job matrices
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: images
        uses: hellofresh/action-changed-files@3b2e213935a6ca5fa6669c8cbffb68eb5a6dbd89 # v4.0.0
        with:
          pattern: images/(?P<image>[^/]+)
          defaults: true

  shellcheck:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Shell
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck
        uses: reviewdog/action-shellcheck@a94d585085f1f5215ae65f4de34e7bbd0523d550 # v1.33.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          fail_level: error
          level: info
          filter_mode: added
          path: images/${{ matrix.image }}

  dockerlint:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: reviewdog/action-hadolint@9d9a44af664599d7fe5ed5ee3d66d2d236cb7f8f # v1.54.0
        with:
          reporter: github-pr-review
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          exclude: '*'
          include: 'images/${{ matrix.image }}/Dockerfile'
          # DL3059: Multiple consecutive `RUN` instructions are used for clarity
          # DL3003: WORKDIR to switch directories isn't the pattern I want
          # DL3008/DL3018: apt/apk versions are deliberately unpinned; the
          # distros only serve the latest build per release, so exact pins
          # can only match it or break the build
          hadolint_ignore: DL3059 DL3003 DL3008 DL3018

  markdownlint:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Markdown
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint - Markdown
        uses: reviewdog/action-markdownlint@d7862f0a8dbbee78e016f527260747a4f2bb2a64 # v0.30.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: info
          filter_mode: added
          fail_level: error
          markdownlint_flags: --config .markdownlint.jsonc images/${{ matrix.image }}/**.md

  trivy:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Trivy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint - Trivy
        uses: reviewdog/action-trivy@765ed28176fa16dcac6ced7a652f51f6fd871174 # v1.16.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: info
          filter_mode: added
          fail_level: error
          working_directory: images/${{ matrix.image }}
          trivy_command: fs
          trivy_target: '.'

  yamllint-base:
    name: Lint - Yamllint Workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint - Yamllint
        uses: reviewdog/action-yamllint@6803b0dc8f295034a6156b924814053acb2e6f5a # v1.24.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review
          yamllint_flags: '.github/workflows .yamllint.yml'

  actionlint:
    name: Lint - Actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint - Actionlint
        uses: reviewdog/action-actionlint@8b682e1e7e512151d73a6b9449cbff173846226e # v1.74.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review

  misspell:
    name: Lint - Misspell
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint - Misspell
        uses: reviewdog/action-misspell@da40ce414be6ce320a9322aa2bae10bd3b9e6ef3 # v1.29.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review

  detect-secrets:
    name: Lint - detect-secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint - detect-secrets
        uses: reviewdog/action-detect-secrets@aa401448f8afc3c826140059b40e614b8ae0081b # v0.30.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review
          detect_secrets_flags: "--exclude-files '\\.git/.*' --exclude-lines '^\\s*secrets: \\|$'"

  lint-results:
    if: always()
    needs: [ markdownlint, dockerlint, shellcheck, trivy ]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          result="${{ needs.markdownlint.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Markdown successfully"
          else
            echo "One or more images failed to lint Markdown"
            exit 1
          fi
          result="${{ needs.dockerlint.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Docker successfully"
          else
            echo "One or more images failed to lint Docker"
            exit 1
          fi
          result="${{ needs.trivy.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Trivy successfully"
          else
            echo "One or more images failed to lint Trivy"
            exit 1
          fi
          result="${{ needs.shellcheck.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Shell successfully"
          else
            echo "One or more images failed to lint Shell"
            exit 1
          fi
