name: Linting
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-matrix:
    name: Generate job matrices
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: images
        uses: hellofresh/action-changed-files@3b2e213935a6ca5fa6669c8cbffb68eb5a6dbd89 # v4.0.0
        with:
          pattern: images/(?P<image>[^/]+)
          defaults: true

  shellcheck:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Shell
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck
        uses: reviewdog/action-shellcheck@0a90156c6e0553996a217f0a9e09be6b0f6bee4c # v1.34.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          fail_level: error
          level: info
          filter_mode: added
          path: images/${{ matrix.image }}

  dockerlint:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: reviewdog/action-hadolint@1df92335c6c70880e301926d46148aeb27de1912 # v1.55.0
        with:
          reporter: github-pr-review
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          exclude: '*'
          include: 'images/${{ matrix.image }}/Dockerfile'
          # DL3059: Multiple consecutive `RUN` instructions are used for clarity
          # DL3003: WORKDIR to switch directories isn't the pattern I want
          # DL3008/DL3018: apt/apk versions are deliberately unpinned; the
          # distros only serve the latest build per release, so exact pins
          # can only match it or break the build
          hadolint_ignore: DL3059 DL3003 DL3008 DL3018

  markdownlint:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Markdown
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint - Markdown
        uses: reviewdog/action-markdownlint@a223028b797326efe9d3c9b55e24d740480c3352 # v0.31.2
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: info
          filter_mode: added
          fail_level: error
          markdownlint_flags: --config .markdownlint.jsonc images/${{ matrix.image }}/**.md

  trivy:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Trivy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint - Trivy
        uses: reviewdog/action-trivy@0eb5663c96f2b3ae3c38e7804f89821339085f0e # v1.17.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: info
          filter_mode: added
          fail_level: error
          working_directory: images/${{ matrix.image }}
          trivy_command: fs
          trivy_target: '.'

  yamllint-base:
    name: Lint - Yamllint Workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint - Yamllint
        uses: reviewdog/action-yamllint@290d92c84b22627946efc7fd6f038ade2d2beede # v1.25.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review
          yamllint_flags: '.github/workflows .yamllint.yml'

  actionlint:
    name: Lint - Actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint - Actionlint
        uses: reviewdog/action-actionlint@74dcecaa9a09bca1e65aabd3101fa0918354c9bf # v1.76.2
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review

  misspell:
    name: Lint - Misspell
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint - Misspell
        uses: reviewdog/action-misspell@7cea3d501cb3834c688e08c89ed77b71764d1784 # v1.30.1
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review

  detect-secrets:
    name: Lint - detect-secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint - detect-secrets
        uses: reviewdog/action-detect-secrets@3bc07a8ce36864e49536f7dba77f7c69ff5219a3 # v0.31.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review
          detect_secrets_flags: "--exclude-files '\\.git/.*' --exclude-lines '^\\s*secrets: \\|$'"

  lint-results:
    if: always()
    needs: [ markdownlint, dockerlint, shellcheck, trivy ]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          result="${{ needs.markdownlint.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Markdown successfully"
          else
            echo "One or more images failed to lint Markdown"
            exit 1
          fi
          result="${{ needs.dockerlint.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Docker successfully"
          else
            echo "One or more images failed to lint Docker"
            exit 1
          fi
          result="${{ needs.trivy.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Trivy successfully"
          else
            echo "One or more images failed to lint Trivy"
            exit 1
          fi
          result="${{ needs.shellcheck.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Shell successfully"
          else
            echo "One or more images failed to lint Shell"
            exit 1
          fi
