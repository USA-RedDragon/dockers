name: Linting
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-matrix:
    name: Generate job matrices
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: images
        uses: hellofresh/action-changed-files@3b2e213935a6ca5fa6669c8cbffb68eb5a6dbd89 # v4.0.0
        with:
          pattern: images/(?P<image>[^/]+)
          defaults: true

  shellcheck:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Shell
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck
        uses: reviewdog/action-shellcheck@950c9d71535c8c49e5c029c33a438ade63b9009c # v1.35.1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          fail_level: error
          level: info
          filter_mode: added
          path: images/${{ matrix.image }}

  dockerlint:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: reviewdog/action-hadolint@a3bc84c51f4ddbcbc5b91d950d0b66c15c88b113 # v1.56.0
        with:
          reporter: github-pr-review
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          exclude: '*'
          include: 'images/${{ matrix.image }}/Dockerfile'
          # DL3059: Multiple consecutive `RUN` instructions are used for clarity
          # DL3003: WORKDIR to switch directories isn't the pattern I want
          # DL3008/DL3018: apt/apk versions are deliberately unpinned; the
          # distros only serve the latest build per release, so exact pins
          # can only match it or break the build
          hadolint_ignore: DL3059 DL3003 DL3008 DL3018

  markdownlint:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Markdown
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint - Markdown
        uses: reviewdog/action-markdownlint@584c3e89347d0b16ede47c73ae199550a02b1b37 # v0.33.1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: info
          filter_mode: added
          fail_level: error
          markdownlint_flags: --config .markdownlint.jsonc images/${{ matrix.image }}/**.md

  trivy:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Trivy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint - Trivy
        uses: reviewdog/action-trivy@c51bf26459dab6a2b5c34e7f43eeb475746f1a00 # v1.18.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: info
          filter_mode: added
          fail_level: error
          working_directory: images/${{ matrix.image }}
          trivy_command: fs
          trivy_target: '.'

  yamllint-base:
    name: Lint - Yamllint Workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint - Yamllint
        uses: reviewdog/action-yamllint@020fba38ce9fed550c704d933aeeb7d6360f7d47 # v1.26.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review
          yamllint_flags: '.github/workflows .yamllint.yml'

  actionlint:
    name: Lint - Actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint - Actionlint
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review

  misspell:
    name: Lint - Misspell
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint - Misspell
        uses: reviewdog/action-misspell@c846b6b0996029d2d39540c8ffebebbd957072db # v1.31.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review

  detect-secrets:
    name: Lint - detect-secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint - detect-secrets
        uses: reviewdog/action-detect-secrets@1939918bdb67fa18bf7cb6e73af72e995f606f92 # v0.32.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review
          detect_secrets_flags: "--exclude-files '\\.git/.*' --exclude-lines '^\\s*secrets: \\|$'"

  lint-results:
    if: always()
    needs: [ markdownlint, dockerlint, shellcheck, trivy ]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          result="${{ needs.markdownlint.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Markdown successfully"
          else
            echo "One or more images failed to lint Markdown"
            exit 1
          fi
          result="${{ needs.dockerlint.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Docker successfully"
          else
            echo "One or more images failed to lint Docker"
            exit 1
          fi
          result="${{ needs.trivy.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Trivy successfully"
          else
            echo "One or more images failed to lint Trivy"
            exit 1
          fi
          result="${{ needs.shellcheck.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Shell successfully"
          else
            echo "One or more images failed to lint Shell"
            exit 1
          fi
