name: Linting
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-matrix:
    name: Generate job matrices
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: images
        uses: hellofresh/action-changed-files@f6db62a551af02bb4bbc88ce6536bf40aa537e8f # v3.0.1
        with:
          pattern: images/(?P<image>[^/]+)
          defaults: true

  shellcheck:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Shell
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Shellcheck
        uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e # v1.32.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          fail_level: error
          level: info
          filter_mode: added
          path: images/${{ matrix.image }}

  dockerlint:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: reviewdog/action-hadolint@921946a7ebaaf08ac72607bad67209f4e52b5407 # v1.50.5
        with:
          reporter: github-pr-review
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          exclude: '*'
          include: 'images/${{ matrix.image }}/Dockerfile'
          # DL3059: Multiple consecutive `RUN` instructions are used for clarity
          # DL3003: WORKDIR to switch directories isn't the pattern I want
          # DL3008/DL3018: apt/apk versions are deliberately unpinned; the
          # distros only serve the latest build per release, so exact pins
          # can only match it or break the build
          hadolint_ignore: DL3059 DL3003 DL3008 DL3018

  markdownlint:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Markdown
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint - Markdown
        uses: reviewdog/action-markdownlint@d7862f0a8dbbee78e016f527260747a4f2bb2a64 # v0.30.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: info
          filter_mode: added
          fail_level: error
          markdownlint_flags: --config .markdownlint.jsonc images/${{ matrix.image }}/**.md

  trivy:
    needs: [ generate-matrix ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).include[0] }}
    name: Lint - Trivy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint - Trivy
        uses: reviewdog/action-trivy@a1e6d7dd5520369c076d7ce639a16442938535d8 # v1.14.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: info
          filter_mode: added
          fail_level: error
          working_directory: images/${{ matrix.image }}
          trivy_command: fs
          trivy_target: '.'

  yamllint-base:
    name: Lint - Yamllint Workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Lint - Yamllint
        uses: reviewdog/action-yamllint@f01d8a48fd8d89f89895499fca2cff09f9e9e8c0 # v1.21.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review
          yamllint_flags: '.github/workflows .yamllint.yml'

  actionlint:
    name: Lint - Actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Lint - Actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review

  misspell:
    name: Lint - Misspell
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Lint - Misspell
        uses: reviewdog/action-misspell@da40ce414be6ce320a9322aa2bae10bd3b9e6ef3 # v1.29.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review

  detect-secrets:
    name: Lint - detect-secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Lint - detect-secrets
        uses: reviewdog/action-detect-secrets@53b50179462bbe04af2f25f088b97e55e1dec3a1 # v0.29.6
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: error
          level: info
          filter_mode: added
          reporter: github-pr-review
          detect_secrets_flags: "--exclude-files '\\.git/.*' --exclude-lines '^\\s*secrets: \\|$'"

  lint-results:
    if: always()
    needs: [ markdownlint, dockerlint, shellcheck, trivy ]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          result="${{ needs.markdownlint.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Markdown successfully"
          else
            echo "One or more images failed to lint Markdown"
            exit 1
          fi
          result="${{ needs.dockerlint.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Docker successfully"
          else
            echo "One or more images failed to lint Docker"
            exit 1
          fi
          result="${{ needs.trivy.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Trivy successfully"
          else
            echo "One or more images failed to lint Trivy"
            exit 1
          fi
          result="${{ needs.shellcheck.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All images linted Shell successfully"
          else
            echo "One or more images failed to lint Shell"
            exit 1
          fi
